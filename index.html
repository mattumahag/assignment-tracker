<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Tracker</title>
    <script>
      // Apply the saved theme before the page paints, to avoid a flash.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("assignment-tracker-theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="settings" class="settings">
      <button
        id="settings-button"
        class="secondary settings-button"
        type="button"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="settings-menu"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Settings
      </button>
      <div id="settings-menu" class="settings-menu" hidden>
        <details id="recent-section" class="settings-section" hidden>
          <summary>Recently completed</summary>
          <ul id="recent-list" class="recent-list"></ul>
          <p id="recent-empty" class="empty-state">No completed tasks yet.</p>
        </details>
        <details class="settings-section">
          <summary>Theme</summary>
          <div class="theme-options" role="radiogroup" aria-label="Theme">
            <label class="theme-option">
              <input type="radio" name="theme" value="system" />
              Match system
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="light" />
              Light
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="dark" />
              Dark
            </label>
          </div>
        </details>
      </div>
    </div>

    <main class="app">
      <section id="auth" class="card" aria-labelledby="auth-title">
        <h1>Assignment Tracker</h1>
        <h2 id="auth-title">Log in</h2>
        <p id="auth-intro">Log in to see your tasks.</p>
        <form id="auth-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              required
              minlength="3"
              maxlength="30"
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              minlength="8"
              maxlength="128"
              autocomplete="current-password"
            />
          </div>
          <div id="confirm-field" class="field" hidden>
            <label for="confirm-password">Confirm password</label>
            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
            />
          </div>
          <button id="auth-submit" type="submit">Log in</button>
        </form>
        <p id="auth-error" class="error" role="alert" hidden></p>
        <p class="auth-switch">
          <span id="auth-toggle-text">New here?</span>
          <button id="auth-toggle" class="link-button" type="button">
            Create an account
          </button>
        </p>
      </section>

      <div id="tracker" hidden>
        <header class="header">
          <div>
            <h1>Assignment Tracker</h1>
            <p id="signed-in-as">Your upcoming tasks, sorted by due date.</p>
          </div>
          <button id="logout" class="secondary" type="button">Log out</button>
        </header>

        <section class="card" aria-labelledby="add-item-heading">
          <h2 id="add-item-heading">Add an item</h2>
          <form id="item-form" novalidate>
            <div class="field">
              <label for="title">Title</label>
              <input
                id="title"
                name="title"
                type="text"
                required
                autocomplete="off"
                placeholder="e.g. Chapter 4 homework"
              />
            </div>

            <div class="field">
              <label for="class-name">Class</label>
              <input
                id="class-name"
                name="className"
                type="text"
                required
                autocomplete="off"
                placeholder="e.g. Biology"
              />
            </div>

            <div class="field">
              <label for="type">Type</label>
              <select id="type" name="type" required>
                <option value="" disabled selected>Select a type</option>
                <option value="assignment">Assignment</option>
                <option value="test">Test</option>
                <option value="event">Event</option>
              </select>
            </div>

            <div class="field">
              <label for="due-date">Due date</label>
              <input id="due-date" name="dueDate" type="date" required />
            </div>

            <button type="submit">Add to list</button>
          </form>
        </section>

        <section class="card" aria-labelledby="list-heading">
          <h2 id="list-heading">Upcoming</h2>
          <p id="list-error" class="error" role="alert" hidden></p>
          <ul id="item-list" class="item-list"></ul>
          <p id="empty-state" class="empty-state">No upcoming tasks.</p>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
